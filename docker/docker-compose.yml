services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/workspace
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
    ports:
      - "8888:8888"
    stdin_open: true
    tty: true
    command: bash

  demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/workspace
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
    ports:
      - "7860:7860"
    command: python app/demo.py
