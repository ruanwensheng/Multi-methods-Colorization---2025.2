project:
  name: "colorization-mlops"
  version: "0.2.0"

# --- Paths ---
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_samples: "data/samples"
  models: "models"
  results: "results"
  data_coco: "data/raw/coco2017"
  models_pretrained: "models/pretrained"
  models_deep: "models/deep_learning"
  results_deep: "results/deep_learning"

# --- Image Settings ---
image:
  input_size: [256, 256]
  color_space: "LAB"

# --- Deep Learning Method ---
deep_learning:
  # Architecture (Zhang et al. 2016)
  model: "zhang16"
  num_classes: 313           # quantized ab color bins from pts_in_hull.npy (Zhang 2016)
                             # Note: ABQuantizer reads pts_in_hull.npy at runtime, so this
                             # value is only a fallback if the .npy file is missing.
  temperature: 0.38          # annealed-mean inference temperature

  # Training
  epochs: 50
  batch_size: 4              # batch=8 + AMP=True crashed at iter 1649 with NaN-poisoned weights
                             # (fp16 overflow as the randomly-init head grew). batch=4 + AMP=False
                             # fits 6 GB VRAM at fp32, ~2x slower per batch but numerically stable.
  learning_rate: 0.0002
  optimizer: "adam"
  betas: [0.9, 0.999]
  weight_decay: 0.0
  scheduler: "step"          # "step", "cosine", or "none"
  scheduler_step_size: 20
  scheduler_gamma: 0.5
  loss: "cross_entropy"      # "cross_entropy" or "huber"

  # Mixed precision (for 6GB VRAM GPUs)
  use_amp: false             # disabled after smoke run 4 hit NaN weights at iter 1649;
                             # GTX 1660 SUPER (CC 7.5) supports fp16 but not bf16 acceleration,
                             # so fp16 AMP is the only fast path and it overflowed here.

  # Training safety / observability (added after smoke-v2 ran 8h with loss=NaN)
  max_grad_norm: 1.0              # clip global gradient L2 norm before optimizer.step
  nan_patience: 5                 # abort if loss is non-finite this many batches in a row
  log_every_n_batches: 50         # MLflow batch-level logging cadence (0 disables)
  checkpoint_every_n_batches: 500 # mid-epoch checkpoint cadence (0 disables)

  # Data
  dataset: "coco2017"
  num_workers: 4             # 4 worker procs on Windows; verified safe via tests/test_dataset.py.
                             # With 0 the Lab-conversion + JPEG-decode latency starves the GPU
                             # (we measured GTX 1660 SUPER at ~70% util, 2.5 h/epoch on 118K imgs).
  val_num_workers: 0         # validate() / benchmark loaders: spawning fresh torch-importing
                             # procs ON TOP of the persistent train workers crashed smoke-v3
                             # with WinError 1455 (pagefile too small). Validation isn't I/O
                             # bound enough to need workers — train loop is paused, GPU idle.
  pin_memory: true

  # Fine-tuning
  pretrained_weights: "models/pretrained/zhang16_eccv.pth"
  freeze_encoder: false
  finetune_epochs: 10

  # Benchmark — held-out evaluation set, seed=42 subset of test2017
  # (NOT val2017, which is used for in-training validation/best-ckpt selection)
  benchmark_size: 1000       # shared test subset size, sampled from test2017

  # Comparison models (3 categories: CNN, Interactive CNN, GAN)
  # CNN: Zhang 2016 - our main reimplementation (see model.py)
  #
  # A fourth Diffusion category (ControlNet + SD 2.1) was originally scoped in
  # but excluded from the benchmark after Stability AI deprecated the SD 2.x line
  # upstream; every open-source colorization checkpoint we found is anchored to
  # that backbone. No tested substitute (SD 1.5 brightness-ControlNet,
  # SD-InstructPix2Pix, Flux) produced a faithful evaluation under the
  # benchmark's identical-conditions constraint. See
  # `reports/deep_learning/sections/experiments.tex` for the full rationale.
  comparison:
    # Interactive CNN: Zhang 2017 (SIGGRAPH) - automatic mode with zero hints
    # Paper: "Real-Time User-Guided Image Colorization with Learned Deep Priors"
    # Repo: https://github.com/richzhang/colorization
    zhang2017:
      enabled: true
    # GAN: DeOldify (Self-Attention GAN / NoGAN)
    # Theory: ChromaGAN (Vitoria 2020), Practice: DeOldify
    # Repo: https://github.com/pvitoria/ChromaGAN
    deoldify:
      enabled: true
      model_path: "models/pretrained/deoldify_artistic.pth"

# --- Evaluation ---
evaluation:
  metrics: ["psnr", "ssim", "lpips"]

# --- Device ---
device: "auto"  # "auto", "cuda", or "cpu"
